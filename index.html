<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#12766d"><title>우리의 결혼준비 자금</title>
<style>
:root{color-scheme:light;--bg:#f5f8f7;--ink:#192e33;--muted:#72838a;--line:#deebea;--teal:#147a70;--light:#e7f5f1;--red:#ca4545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Malgun Gothic",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}.wrap{max-width:900px;margin:0 auto;padding:26px 16px 75px}.head,.top,.between,.totals{display:flex;align-items:center;justify-content:space-between;gap:12px}.head{margin-bottom:20px;flex-wrap:wrap}.logo{font-size:24px;font-weight:850;letter-spacing:-.8px}.sub,.muted{color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:12px;font-weight:750}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.sm{font-size:12px;padding:6px 10px}.btn.danger{color:var(--red)}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:21px;box-shadow:0 2px 12px #1f3d3208}.main-card{margin-bottom:14px}.big{font-size:clamp(30px,5vw,47px);letter-spacing:-1px;font-weight:900;margin:9px 0 14px}.big.over{color:var(--red)}.progress{background:#e6f0ee;border-radius:25px;overflow:hidden;height:14px}.progress>div{height:100%;background:var(--teal);transition:width .2s}.progress>div.low{background:#cb872d}.progress>div.empty{background:var(--red)}.smallnums{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}.totals{margin-top:15px}.stat{flex:1;border:1px solid var(--line);padding:12px;border-radius:13px;background:#fbfdfc}.stat strong{font-size:18px;display:block;margin-top:3px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 11px;flex-wrap:wrap}.sectionhead h2{margin:0;font-size:18px}.tablewrap{overflow-x:auto;padding:0}.table{width:100%;border-collapse:collapse;min-width:560px}.table th{text-align:left;background:#edf5f2;color:#526d6a;font-size:12px;padding:13px 12px}.table td{border-top:1px solid var(--line);padding:12px;vertical-align:middle}.table td.amount{text-align:right;white-space:nowrap;font-weight:800}.table th:last-child,.table td:last-child{text-align:right}.table tr:hover td{background:#fbfdfc}.pill{display:inline-block;background:#edf5f2;border-radius:999px;padding:3px 9px;font-size:12px;color:#43716b}.date{white-space:nowrap;font-size:13px}.desc{font-weight:700;max-width:320px;overflow-wrap:anywhere}.empty-msg{padding:45px 18px;text-align:center;color:var(--muted)}.msg{border:1px solid #f0dfa8;background:#fff9e9;border-radius:12px;padding:11px 13px;font-size:13px;margin:10px 0}.msg.success{background:#e7f6f0;border-color:#b5ded2;color:#166b56}.msg.error{background:#fff0f0;border-color:#efc9c9;color:#a12c2c}.hidden{display:none!important}.state{min-height:20px;color:var(--muted);font-size:13px;font-weight:750;margin:5px 0 10px}.state.saving{color:#aa761e}.state.saved{color:#16745d}.state.error{color:var(--red)}.foot{text-align:center;margin-top:20px;color:var(--muted);font-size:12px}.backdrop{position:fixed;inset:0;z-index:10;background:#162b3288;display:flex;align-items:center;justify-content:center;padding:15px}.modal{background:white;width:min(100%,470px);max-height:94vh;overflow:auto;border-radius:21px;padding:22px;box-shadow:0 20px 45px #07191855}.modal h2{font-size:21px;margin:0 0 14px}.field{margin-bottom:13px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select{width:100%;border:1px solid #c8d8d7;border-radius:10px;padding:12px;background:white;color:var(--ink)}.modalactions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:18px}.help{font-size:12px;color:var(--muted)}.divider{border:0;border-top:1px solid var(--line);margin:16px 0}.mini{font-size:12px;padding:5px 9px;border-radius:9px;background:transparent;border:1px solid #cedcda;color:var(--ink)}.inline-state{font-size:12px;color:var(--muted)}@media(max-width:600px){.wrap{padding:16px 10px 60px}.logo{font-size:21px}.card{padding:15px}.btn{padding:8px 10px}.big{font-size:33px}.totals{gap:6px}.stat{padding:10px 8px}.stat strong{font-size:15px}.table{min-width:0}.table th,.table td{padding:10px 7px}.table th:nth-child(3),.table td:nth-child(3){display:none}.date{font-size:11px}.desc{font-size:13px}.pill{font-size:10px}}
</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><main class="wrap"><header class="head"><div><div class="logo">💍 우리의 결혼준비 자금</div><div class="sub">한 번 정한 예산에서 모든 결혼준비 지출을 관리해요</div></div><div class="actions"><button class="btn sm" id="connectBtn">⚙ 연결 설정</button><button class="btn sm" id="reloadBtn">↻ 새로고침</button><button class="btn sm" id="csvBtn">↓ CSV 저장</button></div></header><div id="notice" class="msg hidden" role="alert"></div><div id="saveState" class="state" role="status" aria-live="polite"></div>
<section class="card main-card"><div class="top"><div><div class="sub">전체 결혼준비 예산</div><strong id="budget" style="font-size:20px">0원</strong></div><button class="btn sm" id="budgetBtn">예산 설정</button></div><hr class="divider"><div class="sub">남은 결혼준비 자금</div><div class="big" id="remaining">0원</div><div class="progress"><div id="progressFill"></div></div><div class="smallnums"><span id="pct">예산을 설정해 주세요</span><span id="usage">사용 0원</span></div><div class="totals"><div class="stat"><span class="sub">누적 지출</span><strong id="total">0원</strong></div><div class="stat"><span class="sub">전체 결제 건수</span><strong id="count">0건</strong></div></div></section>
<div class="sectionhead"><h2>전체 사용내역</h2><button class="btn primary" id="addBtn">＋ 지출 추가</button></div><section class="card tablewrap"><table class="table"><thead><tr><th>날짜</th><th>설명</th><th>결제수단</th><th style="text-align:right">금액</th><th style="text-align:right">관리</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty-msg hidden">아직 사용내역이 없어요. 지출을 추가해 보세요.</div></section><div id="sync" class="foot">구글 시트 연결 전</div></main>
<div class="backdrop hidden" id="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div><div id="modalActions" class="modalactions"></div></div></div>
<script>
'use strict';
const TAB='Wedding',SCOPE='https://www.googleapis.com/auth/spreadsheets',KEY='wedding-budget-config-v1',DEMO_KEY='wedding-budget-demo-v1';
const $=id=>document.getElementById(id), won=n=>Math.round(n).toLocaleString('ko-KR')+'원', safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const uid=()=>crypto.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
let config;try{config={clientId:'',sheetId:'',...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{config={clientId:'',sheetId:''}};
let events=[],token='',tokenClient=null,busy=false,lastSync=null,fetchVersion=0,demo=false;
function notice(s='',type=''){const el=$('notice');el.textContent=s;el.className='msg '+type;el.classList.toggle('hidden',!s)}
function state(s='',type=''){const el=$('saveState');el.textContent=s;el.className='state '+type}
function eventToRow(e){return [e.id,new Date().toISOString(),e.type,e.target,e.date,'',e.amount,JSON.stringify(e.details||{})]}
function entries(){const map=new Map();for(const e of events){if(e.type==='create'||e.type==='edit')map.set(e.target,{...e,recordId:e.target});else if(e.type==='delete')map.delete(e.target)}return [...map.values()].sort((a,b)=>b.date.localeCompare(a.date)||String(b.at||'').localeCompare(String(a.at||'')))}
function budget(){let n=0;for(const e of events)if(e.type==='budget')n=e.amount;return n}
function render(){const list=entries(),b=budget(),used=list.reduce((s,e)=>s+Number(e.amount),0),remain=b-used,pct=b?remain/b*100:0;$('budget').textContent=won(b);$('remaining').textContent=won(remain);$('remaining').classList.toggle('over',remain<0);$('pct').textContent=b?`${pct.toFixed(1)}% 남음`:'예산을 설정해 주세요';$('usage').textContent=`사용 ${won(used)} / 예산 ${won(b)}`;$('total').textContent=won(used);$('count').textContent=list.length+'건';const fill=$('progressFill');fill.style.width=Math.max(0,Math.min(100,pct))+'%';fill.className=pct<=10?'empty':pct<=20?'low':'';
$('rows').innerHTML=list.map(e=>`<tr><td class="date">${safe(e.date)}</td><td><div class="desc">${safe(e.details.description||'')}</div><span class="pill mobile-method">${safe(e.details.method||'미지정')}</span></td><td>${safe(e.details.method||'')}</td><td class="amount">${won(e.amount)}</td><td><button class="mini" data-edit="${safe(e.recordId)}">수정</button></td></tr>`).join('');$('empty').classList.toggle('hidden',list.length!==0);$('sync').textContent=demo?'체험 모드 · 이 브라우저에만 저장':lastSync?'Google Sheets · 마지막 동기화 '+lastSync.toLocaleTimeString('ko-KR'):'Google 로그인 후 공동 기록 조회';updateConnect()}
function updateConnect(){$('connectBtn').textContent=config.clientId&&config.sheetId&&!token&&!demo?'↪ Google 재연결':'⚙ 연결 설정'}
function modal(title,body,buttons){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML='';for(const b of buttons){const el=document.createElement('button');el.textContent=b.text;el.className='btn '+(b.primary?'primary':b.danger?'danger':'');el.onclick=b.action;$('modalActions').append(el)}$('backdrop').classList.remove('hidden')}
function closeModal(){$('backdrop').classList.add('hidden')}
function field(label,id,type,value='',extra=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${safe(value)}" ${extra}></div>`}
async function api(path,method='GET',data){if(!token)throw new Error('Google 재연결이 필요합니다.');const response=await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+encodeURIComponent(config.sheetId)+path,{method,headers:{Authorization:'Bearer '+token,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});if(!response.ok){let m='';try{m=(await response.json()).error?.message||''}catch{}if(response.status===401){token='';updateConnect();throw new Error('로그인이 만료됐습니다. Google 재연결을 눌러 주세요.')}throw new Error(`Google Sheets 오류 ${response.status}: ${m||'시트 이름과 공유 권한을 확인하세요.'}`)}return response.json()}
async function refresh(silent=false){if(demo||!token)return false;const ver=++fetchVersion;try{const data=await api('/values/'+encodeURIComponent("'"+TAB+"'!A2:H")+'?valueRenderOption=UNFORMATTED_VALUE');if(ver!==fetchVersion)return false;const result=[];for(const r of data.values||[]){if(!r[0])continue;try{const detail=JSON.parse(r[7]||'{}');if(!['budget','create','edit','delete'].includes(String(r[2])))continue;result.push({id:String(r[0]),at:String(r[1]||''),type:String(r[2]),target:String(r[3]||''),date:String(r[4]||''),amount:Number(r[6]||0),details:detail})}catch(err){console.warn('잘못된 행 건너뜀',err)}}events=result;lastSync=new Date();render();if(!silent)notice('최신 사용내역을 불러왔습니다.','success');return true}catch(err){if(!silent)notice(err.message,'error');$('sync').textContent='동기화 실패 · 연결 확인 필요';return false}}
async function append(e){if(busy){notice('이전 저장이 끝나면 다시 시도해 주세요.','error');return false}busy=true;state('● 저장 중…','saving');notice();let appended=false;try{if(demo){events.push({...e,at:new Date().toISOString()});localStorage.setItem(DEMO_KEY,JSON.stringify(events));lastSync=new Date();render();state('✓ 이 기기에 저장 완료 (체험 모드)','saved');return true}++fetchVersion;const row=eventToRow(e);await api('/values/'+encodeURIComponent("'"+TAB+"'!A:H")+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS','POST',{values:[row]});appended=true;events.push({...e,at:row[1]});lastSync=new Date();render();state('✓ 구글 시트에 저장 완료','saved');const ok=await refresh(true);if(!ok)state('✓ 저장 완료 · 최신 동기화 확인 필요','saved');return true}catch(err){state(appended?'✓ 저장됨 · 동기화 확인 필요':'✕ 저장 실패 · 다시 시도','error');notice(err.message,'error');return appended}finally{busy=false}}
function openExpense(existing=null){const e=existing;const d=e?.details||{};modal(e?'지출 수정':'새 지출 추가',field('날짜','inDate','date',e?.date||today(),'required')+field('금액 (원)','inAmount','number',e?.amount||'','min="1" step="1" inputmode="numeric" placeholder="예: 500000"')+`<div class="field"><label for="inMethod">결제수단</label><select id="inMethod">${['신용카드','계좌이체','현금'].map(m=>`<option ${d.method===m?'selected':''}>${m}</option>`).join('')}</select></div>`+field('설명','inDescription','text',d.description||'','maxlength="160" placeholder="예: 웨딩홀 계약금" required'),[{text:'취소',action:closeModal},...(e?[{text:'삭제',danger:true,action:()=>remove(e)}]:[]),{text:e?'수정 저장':'지출 추가',primary:true,action:async()=>{const date=$('inDate').value,amount=Number($('inAmount').value),method=$('inMethod').value,description=$('inDescription').value.trim();if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isInteger(amount)||amount<1||amount>100000000000||!description){notice('날짜, 금액, 설명을 올바르게 입력해 주세요.','error');return}const ok=await append({id:uid(),type:e?'edit':'create',target:e?.recordId||uid(),date,amount,details:{method,description}});if(ok)closeModal()}}])}
async function remove(e){if(!confirm('이 지출을 삭제할까요?'))return;const ok=await append({id:uid(),type:'delete',target:e.recordId,date:e.date,amount:0,details:{}});if(ok)closeModal()}
function openBudget(){modal('전체 결혼준비 예산 설정',field('총 예산 (원)','inBudget','number',budget()||'','min="1" step="1" placeholder="예: 20000000"')+'<div class="help">전체 기간에 공통으로 적용돼요. 설정을 변경해도 기존 지출은 유지됩니다.</div>',[{text:'취소',action:closeModal},{text:'예산 저장',primary:true,action:async()=>{const amount=Number($('inBudget').value);if(!Number.isInteger(amount)||amount<1||amount>1000000000000){notice('1원 이상의 올바른 예산을 입력해 주세요.','error');return}if(await append({id:uid(),type:'budget',target:'',date:today(),amount,details:{}}))closeModal()}}])}
function connect(cid=config.clientId,sid=config.sheetId){if(!cid||!sid){setup();return}config={clientId:cid.trim(),sheetId:sid.trim()};localStorage.setItem(KEY,JSON.stringify(config));if(!window.google?.accounts?.oauth2){notice('Google 로그인 기능을 아직 불러오지 못했습니다. 다시 시도해 주세요.','error');return}state('● Google 계정 연결 중…','saving');tokenClient=google.accounts.oauth2.initTokenClient({client_id:config.clientId,scope:SCOPE,callback:async res=>{if(res.error||!res.access_token){state('✕ 로그인 실패','error');notice('Google 로그인 오류: '+(res.error||'접근 권한을 받지 못했습니다.'),'error');return}token=res.access_token;demo=false;events=[];lastSync=null;closeModal();render();state('● Google 시트 불러오는 중…','saving');const ok=await refresh();state(ok?'✓ 공동 저장소 연결 완료':'✕ 데이터 조회 실패',ok?'saved':'error')}});tokenClient.requestAccessToken({prompt:''})}
function setup(){modal('공동 저장소 연결',`<p class="help">기존 생활비 웹앱과 같은 OAuth 클라이언트 ID와 스프레드시트 ID를 사용해요. 새 탭 <b>Wedding</b>만 따로 읽고 써요.</p>${field('Google OAuth 클라이언트 ID','inClient','text',config.clientId,'placeholder="...apps.googleusercontent.com"')}${field('Google 스프레드시트 ID','inSheet','text',config.sheetId,'placeholder="URL의 /d/ 다음 부분"')}<p class="help">Google Sheets의 <b>Wedding</b> 탭 A1:H1에 event_id, created_at, kind, target_id, date, who, amount, details_json 열이 있어야 해요.</p><p class="help">데모 모드는 다른 기기와 공유되지 않아요. 클라이언트 ID는 공개 식별자지만 접근 토큰이나 비밀번호는 절대 공유하지 마세요.</p>`,[{text:'닫기',action:closeModal},{text:'체험 모드',action:()=>{demo=true;token='';try{events=JSON.parse(localStorage.getItem(DEMO_KEY)||'[]')}catch{events=[]}render();closeModal();state('체험 모드 · 이 기기에만 저장')}},{text:'설정 저장',action:()=>{config={clientId:$('inClient').value.trim(),sheetId:$('inSheet').value.trim()};localStorage.setItem(KEY,JSON.stringify(config));token='';events=[];demo=false;lastSync=null;render();closeModal();state('설정 저장 완료 · Google 재연결을 눌러 주세요','saved')}},{text:'Google 로그인',primary:true,action:()=>connect($('inClient').value,$('inSheet').value)}])}
function csvCell(v){const s=String(v??''),n=/^[=+@\-\t\r]/.test(s)?"'"+s:s;return '"'+n.replace(/"/g,'""')+'"'}
function download(){if(!demo&&!token){notice('Google에 재연결한 다음 다운로드해 주세요.','error');return}const data=[['날짜','금액','결제수단','설명'],...entries().map(e=>[e.date,e.amount,e.details.method||'',e.details.description||''])];const csv='\uFEFF'+data.map(row=>row.map(csvCell).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='우리의_결혼준비_자금.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}
$('connectBtn').onclick=()=>{if(config.clientId&&config.sheetId&&!token&&!demo)connect();else setup()};$('reloadBtn').onclick=()=>demo?notice('체험 모드에서는 이 기기에만 저장됩니다.'):refresh();$('csvBtn').onclick=download;$('budgetBtn').onclick=()=>{if(!demo&&!token){notice('예산을 설정하기 전에 Google에 연결해 주세요.','error');return}openBudget()};$('addBtn').onclick=()=>{if(!demo&&!token){notice('지출을 추가하기 전에 Google에 연결해 주세요.','error');return}openExpense()};$('rows').onclick=e=>{const btn=e.target.closest('button[data-edit]');if(!btn)return;const item=entries().find(x=>x.recordId===btn.dataset.edit);if(item)openExpense(item)};$('backdrop').addEventListener('click',e=>{if(e.target===$('backdrop')&&!busy)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!busy)closeModal()});window.addEventListener('focus',()=>{if(token&&!demo&&lastSync&&Date.now()-lastSync.getTime()>120000&&!busy)refresh(true)});setInterval(()=>{if(token&&!demo&&!busy)refresh(true)},120000);
render();state(config.clientId&&config.sheetId?'Google 재연결을 눌러 공동 기록을 불러오세요':'⚙ 연결 설정에서 Google Sheets를 연결해 주세요');
</script></body></html>
